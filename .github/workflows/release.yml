name: Release

# Publishing is driven by the version in package.json, not by manual tags.
# On every push to main we check whether the current version has already been
# released (i.e. a matching `vX.Y.Z` tag exists). If not, we run the gates,
# publish to npm, and create + push the tag. Pushes that don't bump the
# version are a cheap no-op. To cut a release: bump `version` (and CHANGELOG)
# in a PR and merge it.
#
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN. GitHub Actions mints a
# short-lived OIDC token (id-token: write) that npm trades for publish rights,
# so there is no long-lived secret for 2FA to gate (this is what fixed EOTP).
# One-time setup on npmjs.com: the package's Trusted Publishers must list this
# repo (darkroomengineering/fitbox) and workflow file (release.yml).
# Provenance is attached automatically under trusted publishing.

on:
  push:
    branches: [main]

# Serialize releases so two quick merges can't race on publish/tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create and push the version tag
      id-token: write # OIDC token for npm trusted publishing (+ provenance)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + existing tags

      - name: Resolve version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Has this version already been released?
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.meta.outputs.version }}" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.meta.outputs.version }} is already tagged — nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.meta.outputs.version }} is new — releasing."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.publish == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.check.outputs.publish == 'true'
        run: bun x tsc --noEmit

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: bun x vitest run

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: bun run build

      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; Node 22 ships npm 10.x, which
      # predates OIDC support.
      - name: Upgrade npm for OIDC
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest

      - name: Publish to npm (OIDC trusted publishing)
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        env:
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
